name: verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-verification:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NiiRMotion.slnx
      - name: Build, test, localization and release contracts
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/verify-development.ps1 -UiSmoke
