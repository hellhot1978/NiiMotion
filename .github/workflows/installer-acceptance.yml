name: installer acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build and verify release candidate
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build-release-candidate.ps1
      - name: Upload verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: niimotion-installer-candidate
          path: |
            artifacts/installer/*.exe
            artifacts/installer/*.sha256
            artifacts/release/component-inventory.json
            artifacts/release/release-candidate.json
            artifacts/release/release-candidate.sha256
