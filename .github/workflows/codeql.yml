name: code security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze-managed-code:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: Restore
        run: dotnet restore NiiRMotion.slnx
      - name: Build and test through the canonical gate
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/verify-development.ps1
      - uses: github/codeql-action/analyze@v3

  analyze-native-code:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
      - name: Fetch pinned OpenVR SDK
        shell: powershell
        run: git clone --depth 1 --branch v2.15.6 https://github.com/ValveSoftware/openvr.git "$env:RUNNER_TEMP\openvr"
      - name: Build native runtime
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build-native-codeql.ps1 -OpenVrSdkPath "$env:RUNNER_TEMP\openvr"
      - uses: github/codeql-action/analyze@v3
